name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  game-free-quality:
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore locked dependencies
        run: dotnet restore tools/StardewAI.LiveTrainingLoop/StardewAI.LiveTrainingLoop.csproj --locked-mode
      - name: Build contracts and core
        run: dotnet build src/StardewAI.Core/StardewAI.Core.csproj --configuration Release --no-restore
      - name: Build live training loop
        run: dotnet build tools/StardewAI.LiveTrainingLoop/StardewAI.LiveTrainingLoop.csproj --configuration Release --no-restore
      - name: Build supervised policy CLI entry points
        shell: pwsh
        run: |
          foreach ($name in @("StardewAI.PolicyDataset", "StardewAI.PolicyModel")) {
            $project = "tools/$name/$name.csproj"
            dotnet restore $project --locked-mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore knowledge compiler
        run: dotnet restore tools/StardewAI.KnowledgeCompiler/StardewAI.KnowledgeCompiler.csproj --locked-mode
      - name: Build knowledge compiler
        run: dotnet build tools/StardewAI.KnowledgeCompiler/StardewAI.KnowledgeCompiler.csproj --configuration Release --no-restore
      - name: Restore goal-conditioned bootstrap
        run: dotnet restore experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --locked-mode
      - name: Build goal-conditioned bootstrap
        run: dotnet build experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-restore
      - name: Test hermetic bootstrap critical paths
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-bootstrap-hermetic
      - name: Test independent Teacher supervision replay
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-current-stage-one-policy-supervision --output-root "$env:RUNNER_TEMP/policy-supervision-replay"
      - name: Test Rusty Key threshold portfolio composition
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-rusty-key-acquisition-portfolio --output-root "$env:RUNNER_TEMP/rusty-key-threshold-portfolio"
      - name: Test Rusty Key rolling supply producer
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-rusty-key-rolling-supply --output-root "$env:RUNNER_TEMP/rusty-key-rolling-supply"
      - name: Test control execution independently of Teacher supervision
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-control-execution --output-root "$env:RUNNER_TEMP/control-execution"
      - name: Test control support settlement and fresh rebind
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-control-support-rebind --output-root "$env:RUNNER_TEMP/control-support-rebind"
      - name: Test Rusty Key current execution preparation before commit
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-rusty-key-rolling-step --output-root "$env:RUNNER_TEMP/rusty-key-rolling-step"
      - name: Test current native calendar without unrelated Community Center prerequisites
        shell: pwsh
        run: dotnet run --project experiments/StardewAI.GoalConditionedBootstrap/StardewAI.GoalConditionedBootstrap.csproj --configuration Release --no-build -- self-test-current-native-calendar --output-root "$env:RUNNER_TEMP/current-native-calendar"
      - name: Test Rusty Key runtime source pipeline and bounded orchestration without game
        shell: pwsh
        run: ./scripts/Test-RuntimeRustyKeyRolling.ps1 -StepFixtureRoot "$env:RUNNER_TEMP/rusty-key-rolling-step" -CurrentNativeFixtureRoot "$env:RUNNER_TEMP/current-native-calendar" -OutputRoot "$env:RUNNER_TEMP/rusty-key-runtime"
      - name: Restore core governance tests
        run: dotnet restore tests/StardewAI.Core.Tests/StardewAI.Core.Tests.csproj --locked-mode -p:GameFreeGovernance=true
      - name: Test core governance
        run: dotnet test tests/StardewAI.Core.Tests/StardewAI.Core.Tests.csproj --configuration Release --no-restore -p:GameFreeGovernance=true
      - name: Test backend
        run: dotnet test tests/StardewAI.Backend.Tests/StardewAI.Backend.Tests.csproj --configuration Release
      - name: Verify generated current checkpoint
        shell: pwsh
        run: ./scripts/Update-CurrentWorkCheckpoint.ps1 -Check
      - name: Test Rusty Key evidence boundaries without game
        shell: pwsh
        run: ./scripts/Test-RuntimeRustyKeyEvidence.ps1
      - name: Check whitespace
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          } else {
            git diff --check HEAD^ HEAD
          }
