services:
  server:
    volumes:
      - ./runtime/releases/${STARDEWAI_RELEASE_ID:?STARDEWAI_RELEASE_ID is required}/mods:/data/vanilla-ai-mods
      - ./runtime/releases/${STARDEWAI_RELEASE_ID:?STARDEWAI_RELEASE_ID is required}/app:/stardewai-app:ro
      - ./runtime/releases/${STARDEWAI_RELEASE_ID:?STARDEWAI_RELEASE_ID is required}/mods/StardewAI.TransparentBridge:/data/game/Mods/StardewAI.TransparentBridge
      - ./runtime/releases/${STARDEWAI_RELEASE_ID:?STARDEWAI_RELEASE_ID is required}/mods/StardewAI.RuntimeTestHarness:/data/game/Mods/StardewAI.RuntimeTestHarness
      - ./data/ai-state:/state
    environment:
      STARDEWAI_TRAINING_MODE: "1"
      STARDEWAI_FORMAL_RUN_ID: "${STARDEWAI_FORMAL_RUN_ID:?STARDEWAI_FORMAL_RUN_ID is required}"
      STARDEWAI_FORMAL_SAVE_SLOT: "${STARDEWAI_FORMAL_SAVE_SLOT:?STARDEWAI_FORMAL_SAVE_SLOT is required}"
      STARDEWAI_TRAINING_RUN_ID: "${STARDEWAI_FORMAL_RUN_ID:?STARDEWAI_FORMAL_RUN_ID is required}"
      STARDEWAI_FORMAL_TRAINING_ROOT: "${STARDEWAI_FORMAL_TRAINING_ROOT_CONTAINER:-/state/formal-training}"
      STARDEWAI_FORMAL_MIN_FREE_SPACE_MB: "${STARDEWAI_FORMAL_MIN_FREE_SPACE_MB:-8192}"
      STARDEWAI_FORMAL_MAX_ATTEMPTS: "${STARDEWAI_FORMAL_MAX_ATTEMPTS:-2000}"
      STARDEWAI_FORMAL_MAX_PERSISTED_ITERATIONS: "${STARDEWAI_FORMAL_MAX_PERSISTED_ITERATIONS:-4}"
      STARDEWAI_FORMAL_REQUIRED_VERIFIED_ACTIONS: "${STARDEWAI_FORMAL_REQUIRED_VERIFIED_ACTIONS:-1}"
      STARDEWAI_FORMAL_SAVE_BOUNDARY_MAX_ATTEMPTS: "${STARDEWAI_FORMAL_SAVE_BOUNDARY_MAX_ATTEMPTS:-16}"
      STARDEWAI_TRAINING_OUTPUT_DIR: "${STARDEWAI_FORMAL_TRAINING_ROOT_CONTAINER:-/state/formal-training}/runs/${STARDEWAI_FORMAL_RUN_ID}"
      STARDEWAI_DEDICATED_HOST_RUN_ID: "${STARDEWAI_FORMAL_RUN_ID}"
      STARDEWAI_SAVE_ISOLATION_PATH: "/config/xdg/config/StardewValley/Saves"
      STARDEWAI_TEST_SAVES: "/config/xdg/config/StardewValley/Saves"
      STARDEWAI_TEST_SLOT: "${STARDEWAI_FORMAL_SAVE_SLOT:?STARDEWAI_FORMAL_SAVE_SLOT is required}"
      STARDEWAI_TEST_AUTO_LOAD: "true"
      STARDEWAI_BACKEND_URL: "http://127.0.0.1:8795"
      STARDEWAI_BRIDGE_URL: "http://127.0.0.1:8765"
      STARDEWAI_PRODUCT_EXECUTOR_URL: "http://127.0.0.1:8768"
      STARDEWAI_NATIVE_EXECUTOR_URL: "http://127.0.0.1:8767"
      STARDEWAI_EXECUTOR_DIAGNOSTIC_OUTPUT: "${STARDEWAI_FORMAL_TRAINING_ROOT_CONTAINER:-/state/formal-training}/executor-diagnostics"
      STARDEWAI_KNOWLEDGE_EXPORT_ENABLED: "false"
      STARDEWAI_SUPPRESS_LOCAL_RENDER: "${STARDEWAI_SUPPRESS_LOCAL_RENDER:-1}"
      STARDEWAI_OBSERVER_RENDER_INTERVAL_MS: "${STARDEWAI_OBSERVER_RENDER_INTERVAL_MS:-0}"
      SDL_AUDIODRIVER: "dummy"
      ALSOFT_DRIVERS: "null"
